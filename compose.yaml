name: dev-project-agent
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: dev_project_agent
      POSTGRES_USER: dev_project_agent_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_project_agent_migrator -d dev_project_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
